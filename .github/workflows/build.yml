name: Build Audiokings Vocals (Windows + macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item -Recurse "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3" "pack/"
          Copy-Item "installer/Install-AudiokingsVocals.bat" "pack/"
          Compress-Archive -Path "pack/*" -DestinationPath "AudiokingsVocals-Windows-VST3.zip" -Force

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=3.6.0" "installer\AudiokingsVocals.iss"
          if (Test-Path dist) { Get-ChildItem dist } else { Write-Warning "dist folder not found after ISCC" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudiokingsVocals-Windows
          path: |
            AudiokingsVocals-Windows-VST3.zip
            dist/AudiokingsVocals-Setup-*.exe

  # -------------------------------------------------------------------- macOS
  build-macos:
    runs-on: macos-latest
    env:
      # Optional signing + notarization. Without these secrets the plug-ins are ad-hoc signed
      # (they run, but Gatekeeper asks for confirmation the first time).
      HAS_SIGNING: ${{ secrets.APPLE_CERT_APPLICATION_BASE64 != '' }}
      APPLE_CERT_APPLICATION_BASE64: ${{ secrets.APPLE_CERT_APPLICATION_BASE64 }}
      APPLE_CERT_INSTALLER_BASE64: ${{ secrets.APPLE_CERT_INSTALLER_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal build - Apple Silicon and Intel)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Locate plug-ins
        run: |
          echo "=== artefacts tree ==="
          find build/AudiokingsVocals_artefacts -maxdepth 5 | sort
          echo "=== VST3 binary ==="
          lipo -archs "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3/Contents/MacOS/Audiokings Vocals" 2>/dev/null || echo "VST3 binary not found"
          echo "=== AU binary ==="
          lipo -archs "build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component/Contents/MacOS/Audiokings Vocals" 2>/dev/null || echo "AU binary not found"

      - name: Import signing certificates (optional)
        if: env.HAS_SIGNING == 'true'
        run: |
          KC_PW="$(uuidgen)"
          echo "KC_PW=$KC_PW" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          echo "$APPLE_CERT_APPLICATION_BASE64" | base64 --decode > app.p12
          security import app.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          if [ -n "$APPLE_CERT_INSTALLER_BASE64" ]; then
            echo "$APPLE_CERT_INSTALLER_BASE64" | base64 --decode > inst.p12
            security import inst.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/productsign
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" build.keychain

      - name: Sign plug-ins
        run: |
          VST3="build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3"
          AU="build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APP" "$VST3"
            [ -d "$AU" ] && codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APP" "$AU"
          else
            codesign --force --deep --sign - "$VST3"
            [ -d "$AU" ] && codesign --force --deep --sign - "$AU"
          fi
          codesign --verify --deep --strict --verbose=2 "$VST3"
          [ -d "$AU" ] && codesign --verify --deep --strict --verbose=2 "$AU"
          echo "HAS_AU=$([ -d "$AU" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Build installer (.pkg)
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          cp -R "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          if [ -d "build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component" ]; then
            cp -R "build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component" pkgroot/Library/Audio/Plug-Ins/Components/
          else
            echo "Warning: AU component not found - VST3 only pkg"
          fi
          chmod +x installer/mac/scripts/preinstall installer/mac/scripts/postinstall
          pkgbuild --root pkgroot --identifier com.audiokings.vocals --version 3.6.0 \
                   --install-location / --scripts installer/mac/scripts AudiokingsVocals-unsigned.pkg
          if [ "$HAS_SIGNING" = "true" ] && [ -n "$APPLE_DEVELOPER_ID_INSTALLER" ]; then
            productsign --sign "$APPLE_DEVELOPER_ID_INSTALLER" AudiokingsVocals-unsigned.pkg AudiokingsVocals-macOS-3.6.0.pkg
          else
            mv AudiokingsVocals-unsigned.pkg AudiokingsVocals-macOS-3.6.0.pkg
          fi

      - name: Notarize (optional)
        if: env.HAS_SIGNING == 'true' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit AudiokingsVocals-macOS-*.pkg --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple AudiokingsVocals-macOS-*.pkg

      - name: Package zip (plug-ins + uninstaller)
        run: |
          mkdir -p macpack
          cp -R "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3" macpack/
          if [ -d "build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component" ]; then
            cp -R "build/AudiokingsVocals_artefacts/Release/AU/Audiokings Vocals.component" macpack/
          fi
          chmod +x installer/mac/Uninstall-AudiokingsVocals.command
          cp installer/mac/Uninstall-AudiokingsVocals.command macpack/
          ditto -c -k --keepParent macpack AudiokingsVocals-macOS-Plugins.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudiokingsVocals-macOS
          path: |
            AudiokingsVocals-macOS-*.pkg
            AudiokingsVocals-macOS-Plugins.zip

  # ------------------------------------------------------------------ Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.pkg
