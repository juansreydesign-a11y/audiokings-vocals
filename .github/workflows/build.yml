name: Build Audiokings Vocals (Windows VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3" "dist/"
          Copy-Item "installer/Install-AudiokingsVocals.bat" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "AudiokingsVocals-Windows-VST3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiokingsVocals-Windows-VST3
          path: AudiokingsVocals-Windows-VST3.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AudiokingsVocals-Windows-VST3.zip
