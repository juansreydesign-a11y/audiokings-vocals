name: Build Audiokings Vocals (Windows VST3 + Installer)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item -Recurse "build/AudiokingsVocals_artefacts/Release/VST3/Audiokings Vocals.vst3" "pack/"
          Copy-Item "installer/Install-AudiokingsVocals.bat" "pack/"
          Compress-Archive -Path "pack/*" -DestinationPath "AudiokingsVocals-Windows-VST3.zip" -Force

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=3.0.0" "installer\AudiokingsVocals.iss"
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudiokingsVocals-Windows
          path: |
            AudiokingsVocals-Windows-VST3.zip
            dist/AudiokingsVocals-Setup-*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AudiokingsVocals-Windows-VST3.zip
            dist/AudiokingsVocals-Setup-*.exe
